---
# x-ui panel (Xray-core) on the edge host. Pinned image: upgrades are a reviewed commit.
# host networking is required: the panel allocates inbound ports dynamically.
services:
  x-ui:
    # Built from edge/Dockerfile: upstream alireza7/x-ui:1.10.2 has NO sqlite3, which
    # every config-apply and backup script in this repo depends on. Digest-pinned base.
    build:
      context: .
      dockerfile: Dockerfile
    image: proxy-xui:1.10.2
    container_name: x-ui
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./data/x-ui:/etc/x-ui
      - ./certs:/root/cert:ro
    environment:
      - TZ=${TZ:-Asia/Tehran}
      - XUI_ENABLE_FAIL2BAN=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD-SHELL", "pgrep xray >/dev/null && pgrep x-ui >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
