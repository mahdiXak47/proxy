---
- name: Configure the Turkish exit node
  hosts: exit
  become: true
  gather_facts: true

  vars_files:
    # Single source of truth shared with the edge. Order matters: endpoints then secrets.
    - ../../shared/endpoints.yml
    - ../../shared/vault.yml

  pre_tasks:
    - name: Fail fast on unreplaced placeholders
      ansible.builtin.assert:
        that:
          - tr_ip is defined and 'REPLACE_ME' not in tr_ip
          - edge_ip is defined and 'REPLACE_ME' not in edge_ip
          - reality_short_ids | length > 0
          - "'REPLACE_ME' not in reality_short_ids[0]"
          - ssh_exposure in ['open', 'allowlist']
          - ssh_exposure == 'open' or (admin_ssh_cidrs | length > 0)
          - vault_reality_private_key is defined and vault_reality_private_key != 'REPLACE'
          - vault_xray_client_uuid is defined and vault_xray_client_uuid != 'REPLACE'
        fail_msg: >-
          Placeholders remain. Fill shared/endpoints.yml, group_vars/exit/vars.yml
          (admin_ssh_cidrs) and shared/vault.yml before applying.
        quiet: true

    - name: Announce the SSH exposure model
      ansible.builtin.debug:
        msg: >-
          {% if ssh_exposure == 'allowlist' %}
          SSH will be restricted to {{ admin_ssh_cidrs | join(', ') }} - a wrong value here
          LOCKS YOU OUT. Keep a provider console session open.
          {% else %}
          SSH stays reachable from any address (key-only auth, per-source rate limiting,
          fail2ban + recidive). No lockout risk from the firewall in this mode.
          {% endif %}
          REALITY ports {{ reality_port }}/{{ reality_alt_port }} are restricted to
          {{ edge_client_cidrs | join(', ') }} regardless of the SSH mode.

  roles:
    - role: base
      tags: [base]
    - role: hardening
      tags: [hardening]
    - role: xray
      tags: [xray]
