---
- name: Verify the exit node is serving correctly
  hosts: exit
  become: true
  gather_facts: false

  vars_files:
    - ../../shared/endpoints.yml
    - ../../shared/vault.yml

  tasks:
    - name: Xray config is valid
      ansible.builtin.command: "{{ xray_bin }} -test -config {{ xray_conf_dir }}/config.json"
      changed_when: false
      register: xray_test

    - name: Show config test result
      ansible.builtin.debug:
        var: xray_test.stdout_lines

    - name: Xray service state
      ansible.builtin.systemd:
        name: xray
      register: xray_unit

    - name: Service must be active and enabled
      ansible.builtin.assert:
        that:
          - xray_unit.status.ActiveState == 'active'
          - xray_unit.status.UnitFileState == 'enabled'
        fail_msg: "xray is {{ xray_unit.status.ActiveState }} (expected active)"
        quiet: true

    - name: Collect listening sockets
      ansible.builtin.command: ss -tlnH
      changed_when: false
      register: sockets

    - name: Both REALITY ports must be listening
      ansible.builtin.assert:
        that:
          - "':' ~ reality_port in sockets.stdout"
          - "':' ~ reality_alt_port in sockets.stdout"
        fail_msg: "expected listeners on {{ reality_port }} and {{ reality_alt_port }}"
        quiet: true

    - name: Xray must not be running as root
      ansible.builtin.command: "ps -o user= -C xray"
      changed_when: false
      failed_when: false
      register: xray_proc_user

    - name: Assert unprivileged runtime
      ansible.builtin.assert:
        that: "'root' not in xray_proc_user.stdout"
        fail_msg: "xray is running as root - check the systemd unit"
        quiet: true

    - name: Egress must leave from Turkey
      ansible.builtin.uri:
        url: https://ifconfig.co/json
        return_content: true
        timeout: 15
      register: egress
      changed_when: false

    - name: Report egress geography
      ansible.builtin.debug:
        msg: >-
          egress ip={{ egress.json.ip | default('?') }}
          country={{ egress.json.country_iso | default(egress.json.country) | default('?') }}
          asn={{ egress.json.asn_org | default('?') }}

    - name: Assert the exit egresses abroad, not back through the censored country
      vars:
        egress_country: "{{ egress.json.country_iso | default(egress.json.country) | default('') }}"
      ansible.builtin.assert:
        # The security requirement is that traffic leaves from OUTSIDE the restricted
        # country, not any one specific country. This VM egresses as AU, which is fine.
        that:
          - egress_country | length > 0
          - egress_country != domestic_country_iso
        fail_msg: "exit egress country is '{{ egress_country }}' - empty or inside the censored country ({{ domestic_country_iso }})"
        quiet: true

    - name: REALITY must present the borrowed site's real certificate to unauthenticated probes
      ansible.builtin.shell: >-
        set -o pipefail;
        echo | timeout 10 openssl s_client -connect 127.0.0.1:{{ reality_port }}
        -servername {{ reality_server_names[0] }} 2>&1 | head -30
      args:
        executable: /bin/bash
      changed_when: false
      failed_when: false
      register: probe

    - name: Show the probe result (should look like a normal TLS handshake)
      ansible.builtin.debug:
        var: probe.stdout_lines

    - name: nftables ruleset is loaded
      ansible.builtin.command: nft list ruleset
      changed_when: false
      register: nft

    - name: Firewall must default-drop and allowlist the edge
      ansible.builtin.assert:
        that:
          - "'policy drop' in nft.stdout"
          - edge_ip in nft.stdout
        fail_msg: "nftables is not enforcing the expected policy"
        quiet: true

    - name: SSH exposure matches the configured mode
      ansible.builtin.assert:
        that:
          # Modern nftables renders the inline `meter` as a named dynamic set,
          # so match the stable set name rather than the deprecated `meter` keyword.
          - (ssh_exposure == 'open') == ('ssh_rate4' in nft.stdout)
        fail_msg: >-
          ssh_exposure is '{{ ssh_exposure }}' but the live ruleset does not match.
        quiet: true

    - name: Password authentication must be refused
      ansible.builtin.command: "sshd -T"
      changed_when: false
      register: sshd_eff

    - name: Assert key-only authentication
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_eff.stdout | lower"
          - "'kbdinteractiveauthentication no' in sshd_eff.stdout | lower"
          # prohibit-password and without-password are OpenSSH synonyms; sshd -T may
          # emit either. Both mean "root key-only, no password" - accept both.
          - "'permitrootlogin prohibit-password' in sshd_eff.stdout | lower or 'permitrootlogin without-password' in sshd_eff.stdout | lower"
        fail_msg: >-
          sshd is not enforcing key-only auth. With SSH open to the internet this is
          the control that matters most - do not leave it broken.
        quiet: true

    - name: fail2ban jails must be active
      ansible.builtin.command: fail2ban-client status
      changed_when: false
      failed_when: false
      register: f2b

    - name: Report active jails
      ansible.builtin.debug:
        var: f2b.stdout_lines

    - name: Assert the sshd jail is running
      ansible.builtin.assert:
        that: "'sshd' in f2b.stdout"
        fail_msg: "the fail2ban sshd jail is not active"
        quiet: true

    - name: Summary
      ansible.builtin.debug:
        msg: "ALL EXIT-NODE CHECKS PASSED"
