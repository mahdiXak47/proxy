---
# Reload, never restart: a failed restart on a single-NIC remote box means lockout.
# The template's `validate: sshd -t` has already proven the config parses.
- name: Reload sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded

- name: Reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
