---
- name: Create xray system user
  ansible.builtin.user:
    name: "{{ xray_user }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    state: present

- name: Create directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ xray_conf_dir }}" }
    - { path: "{{ xray_share_dir }}" }
    - { path: "{{ xray_log_dir }}", owner: "{{ xray_user }}", mode: "0750" }
    - { path: "{{ xray_download_dir }}" }

# `xray -test` (the config validate below) runs as root and will CREATE the error
# log root-owned if it is missing, after which the non-root service cannot reopen
# it. Pre-create it owned by xray so both the test and the service share one file.
- name: Ensure the error log file exists and is owned by xray
  ansible.builtin.file:
    path: "{{ xray_log_dir }}/error.log"
    state: touch
    owner: "{{ xray_user }}"
    group: "{{ xray_user }}"
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: Check installed xray version
  ansible.builtin.command: "{{ xray_bin }} version"
  register: xray_installed
  changed_when: false
  failed_when: false

- name: Install or upgrade Xray-core
  when: xray_version not in (xray_installed.stdout | default(''))
  block:
    - name: Download release archive
      ansible.builtin.get_url:
        url: "https://github.com/XTLS/Xray-core/releases/download/v{{ xray_version }}/Xray-{{ xray_arch }}.zip"
        dest: "{{ xray_download_dir }}/Xray-{{ xray_arch }}-{{ xray_version }}.zip"
        mode: "0640"
        checksum: "{{ ('sha256:' ~ xray_sha256) if xray_sha256 | length > 0 else omit }}"
        timeout: 60

    - name: Download the release digest
      ansible.builtin.get_url:
        url: "https://github.com/XTLS/Xray-core/releases/download/v{{ xray_version }}/Xray-{{ xray_arch }}.zip.dgst"
        dest: "{{ xray_download_dir }}/Xray-{{ xray_arch }}-{{ xray_version }}.zip.dgst"
        mode: "0640"
        timeout: 60
      when: xray_sha256 | length == 0

    - name: Compute the archive checksum
      ansible.builtin.stat:
        path: "{{ xray_download_dir }}/Xray-{{ xray_arch }}-{{ xray_version }}.zip"
        checksum_algorithm: sha256
      register: zip_stat
      when: xray_sha256 | length == 0

    - name: Read the published digest
      ansible.builtin.slurp:
        src: "{{ xray_download_dir }}/Xray-{{ xray_arch }}-{{ xray_version }}.zip.dgst"
      register: dgst_raw
      when: xray_sha256 | length == 0

    - name: Verify the download against the published SHA256
      ansible.builtin.assert:
        that: zip_stat.stat.checksum in (dgst_raw.content | b64decode)
        fail_msg: >-
          Checksum mismatch. Computed {{ zip_stat.stat.checksum }}, not present in the
          published .dgst file. Refusing to install.
        quiet: true
      when: xray_sha256 | length == 0

    - name: Unpack the archive
      ansible.builtin.unarchive:
        src: "{{ xray_download_dir }}/Xray-{{ xray_arch }}-{{ xray_version }}.zip"
        dest: "{{ xray_download_dir }}"
        remote_src: true
        list_files: true
      register: unpacked

    - name: Install the xray binary
      ansible.builtin.copy:
        src: "{{ xray_download_dir }}/xray"
        dest: "{{ xray_bin }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      notify: Restart xray

    - name: Install geo data files
      ansible.builtin.copy:
        src: "{{ xray_download_dir }}/{{ item }}"
        dest: "{{ xray_share_dir }}/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop:
        - geoip.dat
        - geosite.dat
      notify: Restart xray

  always:
    - name: Clean up the download directory
      ansible.builtin.file:
        path: "{{ xray_download_dir }}"
        state: absent

# The edge dials the exit with serverName set to the exit's IP (no domain SNI):
# domain SNIs to this IP are reset in transit on the edge's egress path, so REALITY
# (which requires a borrowed domain SNI) cannot be used. A self-signed cert pinned
# by the edge gives TLS without a domain. Generated once so the pin stays stable.
- name: Generate the self-signed TLS cert for the REALITY-less TLS inbound
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey rsa:2048 -nodes -days 3650
      -keyout {{ xray_conf_dir }}/self.key -out {{ xray_conf_dir }}/self.crt
      -subj "/CN={{ tr_ip }}"
    creates: "{{ xray_conf_dir }}/self.crt"

- name: Secure the TLS keypair for xray
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: "{{ xray_user }}"
    mode: "0640"
  loop:
    - "{{ xray_conf_dir }}/self.crt"
    - "{{ xray_conf_dir }}/self.key"

- name: Compute the cert pin (sha256) for the edge outbound
  ansible.builtin.shell:
    cmd: "openssl x509 -in {{ xray_conf_dir }}/self.crt -outform DER | openssl dgst -sha256 | sed 's/^.*= //'"
  changed_when: false
  register: cert_pin

- name: Show the cert pin to paste into the edge outbound (pinnedPeerCertSha256)
  ansible.builtin.debug:
    msg: "edge outbound pinnedPeerCertSha256 = {{ cert_pin.stdout }}"

- name: Deploy xray configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ xray_conf_dir }}/config.json"
    owner: root
    group: "{{ xray_user }}"
    mode: "0640"
    validate: "{{ xray_bin }} -test -config %s"
  notify: Restart xray

- name: Deploy systemd unit
  ansible.builtin.template:
    src: xray.service.j2
    dest: /etc/systemd/system/xray.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart xray

- name: Enable and start xray
  ansible.builtin.systemd:
    name: xray
    enabled: true
    state: started
    daemon_reload: true
